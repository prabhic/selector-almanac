# Manual check: can GitHub Actions reach YouTube via yt-dlp?
name: YouTube probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp (latest release)
        run: bash scripts/ci-install-yt-dlp.sh

      - name: Raw yt-dlp channel list
        run: |
          set -eo pipefail
          URL="https://www.youtube.com/channel/UCA4GfsgbI09cLzonTKryC6g/videos"
          echo "Listing channel (first 5 ids)…"
          yt-dlp --flat-playlist --print "%(id)s" "$URL" | head -5 || true
          COUNT=$(yt-dlp --flat-playlist --print "%(id)s" "$URL" | wc -l)
          echo "Total ids: $COUNT"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::YouTube list too small ($COUNT)"
            exit 1
          fi

      - name: Node probe (fetchYouTubeCatalog)
        run: node scripts/probe-youtube.mjs
