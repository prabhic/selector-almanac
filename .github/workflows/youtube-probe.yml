# Manual check: can GitHub Actions reach YouTube via yt-dlp?
name: YouTube probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp (latest release)
        run: bash scripts/ci-install-yt-dlp.sh

      - name: Node probe (fetchYouTubeCatalog)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: node scripts/probe-youtube.mjs
