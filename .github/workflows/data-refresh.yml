# CI: new PPTX from GitHub + re-parse recent slides. YouTube match/chapters stay local.
# Manual: Actions → Data refresh (delta) → Run workflow
# Schedule: Saturday 08:00 IST (02:30 UTC) — after Friday AI-Updates deck lands.
name: Data refresh (delta)

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: Weeks back to re-parse PPTX (YouTube is not fetched in CI)
        required: false
        default: "2"
      parse_slides:
        description: Download and parse PPTX for refresh targets
        type: boolean
        default: true
  schedule:
    - cron: "30 2 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest new decks and re-parse slides
        env:
          WEEKS: ${{ github.event.inputs.weeks || '2' }}
          PARSE: ${{ (github.event_name == 'schedule' || github.event.inputs.parse_slides != 'false') && '1' || '0' }}
        run: |
          set -euo pipefail
          node scripts/ingest-new-decks.mjs --skip-youtube
          ARGS=(--weeks "$WEEKS" --slides-only)
          if [ "$PARSE" = "1" ]; then ARGS+=(--parse); fi
          node scripts/refresh-recent.mjs "${ARGS[@]}"
          npm run build
          npm run validate

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: deck ingest from GitHub Actions"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
